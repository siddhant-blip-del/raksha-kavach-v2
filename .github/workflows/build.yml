name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get --no-pubspec-overrides

    - name: Force Android v2 Embedding Setup
      run: |
        mkdir -p android/app/src/main/java/com/siddhant/rakshakavach
        cat << 'EOF' > android/app/src/main/java/com/siddhant/rakshakavach/MainActivity.kt
        package com.siddhant.rakshakavach
        import io.flutter.embedding.android.FlutterActivity
        class MainActivity: FlutterActivity() {}
        EOF

    - name: Build Release APK
      run: flutter build apk --release --no-pub

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: raksha-kavach-v2-release
        path: build/app/outputs/flutter-apk/app-release.apk